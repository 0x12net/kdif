name: "Release - KiCad PCM"

# Builds the installable KiCad PCM archive (see PCM/README.md), attaches it to
# the GitHub release of the pushed tag, and refreshes the self-hosted PCM
# repository index so KiCad's Plugin and Content Manager offers the new version
# as an update to everyone who added the repository URL.
#
# The tag ("v1.2.3") is used verbatim for the release, the zip filename and the
# download URL; the leading "v" is stripped only where it lands in a PCM
# "version" field, whose schema pattern allows digits and dots alone (see
# PCM/create_pcm_archive.py's strip_v()).
on:
  push:
    tags:
      - "v*.*.*"

# Needed by softprops/action-gh-release (creates the release, uploads the
# archive) and by publish_repository below (uploads assets to the rolling
# "pcm-repository" release through gh).
permissions:
  contents: write

jobs:
  build_archive:
    name: Build PCM archive
    runs-on: ubuntu-latest
    outputs:
      version: ${{ github.ref_name }}
      download_sha256: ${{ steps.archive.outputs.download_sha256 }}
      download_size: ${{ steps.archive.outputs.download_size }}
      download_url: ${{ steps.archive.outputs.download_url }}
      install_size: ${{ steps.archive.outputs.install_size }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Building the PCM archive
        id: archive
        # create_pcm_archive.py writes download_sha256/download_size/
        # download_url/install_size straight into $GITHUB_OUTPUT, which is what
        # makes them readable as job outputs by publish_repository below.
        run: python3 PCM/create_pcm_archive.py "${{ github.ref_name }}"

      - name: Validating the PCM archive
        run: python3 PCM/check_archive.py "PCM/kdif_${{ github.ref_name }}.zip"

      - name: Publishing to GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: PCM/kdif_*.zip

  publish_repository:
    name: Publish PCM repository
    needs: build_archive
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      # packages.json has to accumulate every released version, but a GitHub
      # release asset is overwritten rather than merged - so whatever is
      # published today is pulled down first and merged into by
      # PCM/pcm_repository.py.
      - name: Fetching the currently published packages.json, if any
        run: |
          mkdir -p pcm-repository
          gh release download pcm-repository \
            --repo "${{ github.repository }}" \
            --pattern packages.json \
            --dir pcm-repository \
            --clobber \
          || echo "no pcm-repository release yet - this is the first publish"

      - name: Updating the repository index
        run: |
          python3 PCM/pcm_repository.py \
            --version "${{ needs.build_archive.outputs.version }}" \
            --download-sha256 "${{ needs.build_archive.outputs.download_sha256 }}" \
            --download-size "${{ needs.build_archive.outputs.download_size }}" \
            --download-url "${{ needs.build_archive.outputs.download_url }}" \
            --install-size "${{ needs.build_archive.outputs.install_size }}"

      # The index lives on a rolling release with the fixed tag
      # "pcm-repository" - not a product release, just a stable URL to
      # re-upload these files to, so nothing generated is committed to git and
      # branch protection on main is never involved.
      - name: Publishing to the rolling "pcm-repository" release
        run: |
          gh release view pcm-repository --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create pcm-repository \
              --repo "${{ github.repository }}" \
              --title "PCM repository index" \
              --notes "Machine-generated by .github/workflows/release-kicad-pcm.yml on every tag push" \
              --prerelease
          # resources.zip only exists when PCM/icon.png does (see
          # PCM/pcm_repository.py's _write_resources()).
          files="pcm-repository/packages.json pcm-repository/repository.json"
          [ -f pcm-repository/resources.zip ] && files="$files pcm-repository/resources.zip"
          gh release upload pcm-repository \
            --repo "${{ github.repository }}" \
            --clobber \
            $files
