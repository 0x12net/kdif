name: "Release - Debian"

# Builds the .deb package and attaches it to the GitHub release of the pushed
# tag. The KiCad PCM archive for the same tag is built and attached in parallel
# by release-kicad-pcm.yml - both add assets to this one release.
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  Release:
    name: Build and publish the .deb
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      # The repository carries a 0.0.0 placeholder; the pushed tag is what this
      # release is. Everything downstream reads kdif.__version__ - here that is
      # the Makefile's VERSION default, hence no VERSION= below.
      - name: Stamping the release version
        run: python3 packaging/set_version.py "${{ github.ref_name }}"

      - name: Building the .deb package
        run: make deb

      - name: List package contents
        run: dpkg-deb -I *.deb && dpkg-deb -c *.deb

      - name: Publishing to GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: "*.deb"
