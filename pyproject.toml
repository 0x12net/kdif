[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kdif"
# Not written down twice: the version lives in kdif/__init__.py, where the
# release workflows stamp the git tag into it (packaging/set_version.py).
dynamic = ["version"]
description = "Generate an interactive HTML diff viewer for KiCad PCBs and schematics from git history (drives kicad-cli; also ships as a KiCad PCM plugin)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "MuratovAS", email = "muratovas@0x12.net" }]
classifiers = [
    "Environment :: Console",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Programming Language :: Python :: 3",
]

[project.scripts]
kdif = "kdif.cli:main"

[tool.setuptools]
packages = ["kdif"]

[tool.setuptools.dynamic]
version = { attr = "kdif.__version__" }

[tool.setuptools.package-data]
kdif = ["template/*.html"]
